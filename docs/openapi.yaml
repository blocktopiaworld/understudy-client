openapi: 3.1.0
info:
  title: understudy-client control API
  version: "1"
  summary: One headless Minecraft bot, over HTTP.
  description: |
    Start a bot with `-control <port>` and it serves this API, so a test suite in
    any language can drive it.

    There is **no authentication**. Bind it to loopback.

    Field names here are the canonical spelling. The server matches them
    case-insensitively, so `x` and `X` both work — but this document names
    one of the two, and a client that follows it is always accepted.

    Every endpoint reports what actually happened rather than what was asked
    for. The server accepts and silently ignores a great deal — a click on a
    stale window, a trade with a villager that has run out, a block placed
    inside an entity — so these verbs confirm through observed state instead.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8181
    description: A bot started with -control 8181
tags:
  - name: Reading
    description: Answered from the client's own model. These never wait on the server.
  - name: Movement
    description: Aiming, walking, sprinting and falling.
  - name: Blocks
    description: Breaking and placing.
  - name: Items
    description: Holding, wearing, eating and dropping.
  - name: Combat
    description: Attacking, shooting and interacting with entities.
  - name: Containers
    description: Windows, and moving things through them.
  - name: Workstations
    description: Furnaces, anvils, looms and the rest. Each takes the block to work at.
components:
  schemas:
    Envelope:
      type: object
      description: |
        Every POST that succeeds returns where the bot ended up, plus whatever
        that verb measured.
      properties:
        ok: { type: boolean }
        x: { type: number }
        y: { type: number }
        z: { type: number }
        yaw: { type: number }
        pitch: { type: number }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, and usually what to do about it.
        reason:
          type: string
          description: |
            A short stable code for the kind of refusal, on a 409. Present when
            the client knows which it has, absent when it does not — because a
            guess here is worse than a silence.
          enum:
            - not_targetable
            - not_tracked
            - locked_out
            - too_hungry
            - dead
            - no_such_item
            - out_of_reach
            - occluded
            - no_window
            - wrong_window
            - no_offers
            - no_such_trade
            - no_ui
            - blocked
            - unchanged
            - unsupported
        retryable:
          type: boolean
          description: |
            Whether the same call, unchanged, could succeed later. A caller
            waiting on an action can stop the moment this is false rather than
            spending its whole timeout on something that will not become true.
            Absent alongside "reason".
