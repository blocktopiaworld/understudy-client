  /shoot:
    post:
      operationId: shoot
      tags: [Combat]
      summary: "Draws a bow and looses an arrow at a target:"
      description: |
        {"block":{"x":..,"y":..,"z":..}}   shoot a block, aimed at its centre
        	{"x":..,"y":..,"z":..}             shoot an exact point
        	{"type":"zombie"}                  shoot the nearest entity of a type
        	{"draw_ms":1000}                   draw time; 1000ms is full power
        
        Draw time is the power control: the curve is (t²+2t)/3, so half a second
        gives roughly 40% power, not 50%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [block]
                - required: [x, y, z]
                - required: [type]
              properties:
                x:
                  type: number
                y:
                  type: number
                z:
                  type: number
                block:
                  type: object
                type:
                  type: string
                draw_ms:
                  type: integer
                  minimum: 0
                item:
                  type: string
                  description: The bow to draw. Optional, and held first when given.
      responses:
        "200":
          description: Done. A POST also carries the envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
        "400":
          description: |
            You asked wrongly — bad JSON, an unknown field, an unparseable
            coordinate.
          content:
