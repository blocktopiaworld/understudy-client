  /trades:
    get:
      operationId: handleTrades
      tags: [Containers]
      summary: "Lists a merchant's offers, including the ones that are spent — a caller testing lockout needs to see them, not have them filtered away. handleTrades reports a merchant's offers, and says which kind of \"none\" it has when there are none."
      description: |
        An empty list used to mean any of three things: no window open, a window that
        is not a merchant, or a merchant with nothing to sell. They need different
        fixes, and collapsing them left callers polling in a loop to find out which
        they had — the caller doing the client's job.
      responses:
