# Cuts binaries when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Deliberately plain: the project has no dependencies and one binary, so
# `go build` per platform is the whole job and there is nothing a release tool
# would do here that a loop does not.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: verify before publishing
        run: make check

      - name: build every platform
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/understudy-client_${version}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "$out" ./cmd/understudy-client
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
