# What CI runs is exactly what `make check` runs locally, in the same order.
# A contributor who runs `make check` before pushing should never be surprised
# here, and if these two ever drift the Makefile is the one to fix.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the fuzzers keep searching without slowing anyone's pull request.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so the toolchain cannot drift from what the module
          # declares. This project has no dependencies, so there is nothing else
          # a version bump could disturb.
          go-version-file: go.mod
          check-latest: true

      - name: formatting
        run: make fmt-check

      - name: vet
        run: make vet

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # The Makefile finds golangci-lint wherever it is; the action installs
          # its own, so let the action drive it and keep one config file.
          args: --config .golangci.yml

      - name: tests under the race detector
        run: make race

      - name: build
        run: make build

  # Generated tables are checked in, and a stale one is not a compile error —
  # it is a silently wrong protocol table. This proves the checked-in files are
  # what the generators actually produce.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the version tables compile and register
        run: go test ./protocol/... -run Version -count=1

  # The seed corpus runs as part of `make race` — a fuzz target is an ordinary
  # test until you pass -fuzz. This job goes looking for new inputs, which is
  # worth doing on a schedule rather than on every push: the two defects it has
  # found so far (unbounded recursion, unbounded list lengths) both took more
  # than a few seconds of searching.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/nbt, name: FuzzSkipTag }
          - { pkg: ./understudy, name: FuzzSkipComponent }
          - { pkg: ./understudy, name: FuzzReadSlot }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ${{ matrix.target.pkg }} -fuzz ${{ matrix.target.name }} -fuzztime 5m
      - name: keep whatever it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target.name }}
          path: "**/testdata/fuzz/**"
